services:
  - type: web
    name: rentnest
    runtime: node
    rootDir: backend
    buildCommand: cd ../frontend && npm install && npx expo export --platform web && cd ../backend && npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard → Environment
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard → Environment
